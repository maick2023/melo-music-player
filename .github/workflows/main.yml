name: Build Android APK & Apple iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 页面手动一键点击触发打包

jobs:
  # =========================================================================
  # 任务一：云端自动编译 Android 安装包 (MeloMusic_Android_Release.apk)
  # =========================================================================
  build_android_apk:
    name: Build Android APK (安卓安装包)
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 配置 Flutter 稳定版环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: 4. 自动补全 Android 原生宿主目录并注入音乐/蓝牙/网络权限
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            FOUND_PUB=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1 || true)
            if [ -n "$FOUND_PUB" ]; then
              SUBDIR=$(dirname "$FOUND_PUB")
              if [ "$SUBDIR" != "." ]; then
                cp -rf "$SUBDIR"/* .
              fi
            fi
          fi
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name melo_qq_music_player --org com.melomusic.player .
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>/' "$MANIFEST"
          fi

      - name: 5. 拉取 Flutter 插件依赖
        run: |
          flutter pub get

      - name: 6. 修复主工程与第三方插件的 compileSdk 36、namespace、禁用 Lint 死锁与 Kotlin JVM 目标校验
        run: |
          python3 - << 'EOF'
          import os, re

          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          search_roots = ["android", pub_cache]

          for root in search_roots:
              if not os.path.exists(root):
                  continue
              for dirpath, _, filenames in os.walk(root):
                  for fname in filenames:
                      if fname not in ("build.gradle", "build.gradle.kts"):
                          continue
                      fpath = os.path.join(dirpath, fname)
                      with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      orig = content
                      is_kts = fpath.endswith(".kts")

                      # 1. 将独立成行的 compileSdk / compileSdkVersion 升至 36（不改动 JavaCompile 的 bootClasspath）
                      content = re.sub(
                          r"^(\s*)compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)\s*$",
                          r"\1compileSdkVersion 36",
                          content,
                          flags=re.MULTILINE,
                      )
                      content = re.sub(
                          r"^(\s*)compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$",
                          r"\1compileSdk = 36",
                          content,
                          flags=re.MULTILINE,
                      )
                      content = re.sub(
                          r"^(\s*)compileSdk\s+(?:flutter\.compileSdkVersion|\d+)\s*$",
                          r"\1compileSdk = 36" if is_kts else r"\1compileSdk 36",
                          content,
                          flags=re.MULTILINE,
                      )

                      # 2. 将主工程 app 的 minSdk 设为 24，targetSdk 设为 35
                      if os.path.sep + "app" + os.path.sep in fpath:
                          content = re.sub(
                              r"^(\s*)minSdkVersion\s+(?:flutter\.minSdkVersion|\d+)\s*$",
                              r"\1minSdkVersion 24",
                              content,
                              flags=re.MULTILINE,
                          )
                          content = re.sub(
                              r"^(\s*)minSdk\s*=\s*(?:flutter\.minSdkVersion|\d+)\s*$",
                              r"\1minSdk = 24",
                              content,
                              flags=re.MULTILINE,
                          )
                          content = re.sub(
                              r"^(\s*)targetSdkVersion\s+(?:flutter\.targetSdkVersion|\d+)\s*$",
                              r"\1targetSdkVersion 35",
                              content,
                              flags=re.MULTILINE,
                          )
                          content = re.sub(
                              r"^(\s*)targetSdk\s*=\s*(?:flutter\.targetSdkVersion|\d+)\s*$",
                              r"\1targetSdk = 35",
                              content,
                              flags=re.MULTILINE,
                          )

                      # 3. 自动为缺少 namespace 的旧插件 (如 on_audio_query_android) 补齐 namespace 并移除 Manifest 中的 package 属性
                      manifest_path = os.path.join(dirpath, "src", "main", "AndroidManifest.xml")
                      if os.path.exists(manifest_path):
                          with open(manifest_path, "r", encoding="utf-8", errors="ignore") as mf:
                              mcontent = mf.read()
                          pkg_match = re.search(r'package\s*=\s*"([^"]+)"', mcontent)
                          if pkg_match:
                              pkg_name = pkg_match.group(1)
                              if "namespace" not in content:
                                  ns_stmt = f'    namespace = "{pkg_name}"\n' if is_kts else f"    namespace '{pkg_name}'\n"
                                  content = re.sub(r"(^\s*android\s*\{)", r"\1\n" + ns_stmt, content, count=1, flags=re.MULTILINE)
                              if os.path.sep + "app" + os.path.sep not in fpath:
                                  new_mcontent = re.sub(r'\s*package\s*=\s*"[^"]+"', "", mcontent, count=1)
                                  if new_mcontent != mcontent:
                                      with open(manifest_path, "w", encoding="utf-8") as mf:
                                          mf.write(new_mcontent)

                      # 4. 在每个 android { ... } 块内注入 checkReleaseBuilds = false，从根源阻断 AGP 9.1 lintVitalAnalyzeRelease 提取 out.aar 报错
                      if "checkReleaseBuilds" not in content:
                          if is_kts:
                              lint_block = "    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
                          else:
                              lint_block = "    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
                          content = re.sub(r"(^\s*android\s*\{)", r"\1\n" + lint_block, content, count=1, flags=re.MULTILINE)

                      if content != orig:
                          with open(fpath, "w", encoding="utf-8") as f:
                              f.write(content)
                          print(f"[Patched] {fpath}")

          # 5. 在 gradle.properties 中写入 kotlin.jvm.target.validation.mode=ignore 并禁用并发缓存冲突
          for prop_path in ["android/gradle.properties", os.path.expanduser("~/.gradle/gradle.properties")]:
              os.makedirs(os.path.dirname(prop_path), exist_ok=True)
              existing = ""
              if os.path.exists(prop_path):
                  with open(prop_path, "r", encoding="utf-8", errors="ignore") as pf:
                      existing = pf.read()
              if "kotlin.jvm.target.validation.mode" not in existing:
                  with open(prop_path, "a", encoding="utf-8") as pf:
                      pf.write("\nkotlin.jvm.target.validation.mode=ignore\n")

          # 6. 在 Gradle 初始化脚本中过滤掉所有大小写 lint 任务（包含 lintVitalAnalyzeRelease）并放行 check*AarMetadata
          init_dir = os.path.expanduser("~/.gradle/init.d")
          os.makedirs(init_dir, exist_ok=True)
          with open(os.path.join(init_dir, "fix_flutter_plugins.gradle"), "w", encoding="utf-8") as gf:
              gf.write('''
          gradle.taskGraph.whenReady { graph ->
              graph.allTasks.each { task ->
                  def lower = task.name.toLowerCase()
                  if (lower.contains("lint")) {
                      task.enabled = false
                  }
              }
          }
          gradle.projectsEvaluated {
              rootProject.allprojects { proj ->
                  proj.tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.configureEach { task ->
                      task.actions.clear()
                      task.doLast {
                          task.outputs.files.each { f -> f.mkdirs() }
                      }
                  }
                  proj.tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach {
                      enabled = false
                  }
                  def javaTask = proj.tasks.findByName("compileReleaseJavaWithJavac") ?: proj.tasks.findByName("compileDebugJavaWithJavac")
                  if (javaTask != null && javaTask.targetCompatibility != null) {
                      def targetVer = javaTask.targetCompatibility.toString()
                      proj.tasks.matching { it.name.contains("Kotlin") }.configureEach { kTask ->
                          try {
                              kTask.kotlinOptions.jvmTarget = targetVer
                          } catch (Throwable ignored) {}
                      }
                  }
              }
          }
          ''')
          print("[Success] AGP 9.1 lintVitalAnalyzeRelease disabler and Gradle 9.3 AAR Metadata fix installed.")
          EOF

      - name: 7. 编译正式版 Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk MeloMusic_Android_Release.apk

      - name: 8. 上传 Android APK 安装包产物 (供直接下载安装到安卓手机)
        uses: actions/upload-artifact@v4
        with:
          name: MeloMusic-Android-APK
          path: MeloMusic_Android_Release.apk
          if-no-files-found: error

  # =========================================================================
  # 任务二：使用 GitHub 免费 macOS 云服务器自动打包苹果 iOS 安装包 (.ipa)
  # =========================================================================
  build_ios_ipa:
    name: Build Apple iOS IPA (苹果安装包)
    runs-on: macos-14
    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 配置 Flutter 稳定版环境 (macOS)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. 自动补全 iOS 原生宿主工程并注入后台播放/媒体库/麦克风/局域网权限
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            FOUND_PUB=$(find . -maxdepth 4 -name "pubspec.yaml" | head -n 1 || true)
            if [ -n "$FOUND_PUB" ]; then
              SUBDIR=$(dirname "$FOUND_PUB")
              if [ "$SUBDIR" != "." ]; then
                cp -rf "$SUBDIR"/* .
              fi
            fi
          fi
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --project-name melo_qq_music_player --org com.melomusic.player .
          fi
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string '需要访问您的媒体库以自动扫描并播放本地无损音乐'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string '需要使用局域网开启 Wi-Fi 无线传歌服务'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '需要使用麦克风进行 AI 语音点歌与语音控制'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string '需要语音识别以将您的语音转化为点歌指令'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true

      - name: 4. 安装依赖并编译免证书 iOS Release 归档包 (--no-codesign)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: 5. 将 Runner.app 封装为标准苹果 .ipa 安装包 (支持爱思助手/Sideloadly/AltStore自签安装)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 MeloMusic_iOS_Unsigned.ipa Payload
          rm -rf Payload

      - name: 6. 上传苹果 iOS IPA 安装包产物 (供下载后用爱思助手/Sideloadly装入iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: MeloMusic-iOS-IPA
          path: MeloMusic_iOS_Unsigned.ipa
          if-no-files-found: error
