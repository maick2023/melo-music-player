name: Build Android APK & Apple iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android_apk:
    name: Build Android APK (安卓安装包)
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 自动兼容文件目录结构
        run: |
          if [ ! -f "pubspec.yaml" ] && [ -f "flutter_qq_music_player/pubspec.yaml" ]; then
            cp -r flutter_qq_music_player/* .
          fi

      - name: 3. 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 配置 Flutter 稳定版环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. 自动补全 Android 工程与权限配置
        run: |
          flutter create --project-name melo_music_player --platforms=android --org com.melomusic.player .
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH"\/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>/' "$MANIFEST"
          fi
          # 将 Kotlin/Java 目标版本不一致强制拦截降级为警告（防止构建中断）
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: 6. 获取依赖并修复第三方库兼容性
        run: |
          flutter pub get
          # 1. 补全 on_audio_query 缺失的 namespace (兼容 AGP 8)
          find /home/runner/.pub-cache/hosted/ -path "*/on_audio_query_android*/android/build.gradle" -exec sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"' {} +
          # 2. 将 on_audio_query 中的 Java 编译目标升级至 17
          find /home/runner/.pub-cache/hosted/ -path "*/on_audio_query_android*/android/build.gradle" -exec sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' {} +
          find /home/runner/.pub-cache/hosted/ -path "*/on_audio_query_android*/android/build.gradle" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
          # 3. 将 on_audio_query 中的 Kotlin jvmTarget 对齐至 17
          find /home/runner/.pub-cache/hosted/ -path "*/on_audio_query_android*/android/build.gradle" -exec sed -i 's/jvmTarget = .*/jvmTarget = "17"/g' {} +

      - name: 7. 编译正式版 Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk MeloMusic_Android_Release.apk

      - name: 8. 上传 Android APK 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: MeloMusic-Android-APK
          path: MeloMusic_Android_Release.apk
          if-no-files-found: error

  build_ios_ipa:
    name: Build Apple iOS IPA (苹果安装包)
    runs-on: macos-14
    steps:
      - name: 1. 检出源码仓库
        uses: actions/checkout@v4

      - name: 2. 自动兼容文件目录结构
        run: |
          if [ ! -f "pubspec.yaml" ] && [ -f "flutter_qq_music_player/pubspec.yaml" ]; then
            cp -r flutter_qq_music_player/* .
          fi

      - name: 3. 配置 Flutter 稳定版环境 (macOS)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. 自动补全 iOS 工程与权限
        run: |
          flutter create --project-name melo_music_player --platforms=ios --org com.melomusic.player .
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppleMusicUsageDescription string '需要访问您的媒体库以自动扫描并播放本地无损音乐'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string '需要使用局域网开启 Wi-Fi 无线传歌服务'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string '需要使用麦克风进行 AI 语音点歌与语音控制'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string '需要语音识别以将您的语音转化为点歌指令'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true

      - name: 5. 编译并封装苹果 .ipa 安装包
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --no-tree-shake-icons
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 MeloMusic_iOS_Unsigned.ipa Payload
          rm -rf Payload

      - name: 6. 上传苹果 iOS IPA 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: MeloMusic-iOS-IPA
          path: MeloMusic_iOS_Unsigned.ipa
          if-no-files-found: error
